name: "Release Prep"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Module version to be released. Must be a valid semver string. (1.2.3)"
        required: true

jobs:
  # Disabled: the org Actions policy only allows reusable workflows from enterprise-owned repositories.
  release_prep:
    if: false
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_release_prep.yml@080450d19d0822c5aabef29109cea62b4579866e"
    with:
      version: "${{ github.event.inputs.version }}"
      ruby_version: "3.3"
    secrets: "inherit"
