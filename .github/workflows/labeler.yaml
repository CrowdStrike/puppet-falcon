name: "Issue Labeler"
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  # Disabled: the org Actions policy only allows actions from enterprise-owned repositories.
  triage:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: github/issue-labeler@e24a3eb6b2e28c8904d086302a2b760647f5f45c  # v3.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yaml
        enable-versioned-regex: 0
