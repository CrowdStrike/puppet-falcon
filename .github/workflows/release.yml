name: "Module Release"

on:
  workflow_dispatch:

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    if: github.repository_owner == 'CrowdStrike'

    steps:

      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"  # v4.4.0
        with:
          ref: "${{ github.ref }}"
          clean: true
          fetch-depth: 0

      - name: "Get version"
        id: "get_version"
        run: |
          echo "version=$(jq --raw-output .version metadata.json)" >> $GITHUB_OUTPUT

      - name: "Activate Ruby 3.3"
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0  # v1.342.0
        with:
          ruby-version: "3.3"

      # The puppet/pdk images bundle Ruby 3.2 and 2.7, so PDK is installed as a gem on Ruby 3.3.
      - name: "Install PDK"
        run: |
          gem install pdk --version 3.4.0 --no-document

      - name: "PDK build"
        run: |
          pdk build

      - name: "Generate release notes"
        run: |
          export GH_HOST=github.com
          gh extension install chelnak/gh-changelog
          gh changelog get --latest > OUTPUT.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create release"
        run: |
          gh release create v${{ steps.get_version.outputs.version }} --title v${{ steps.get_version.outputs.version }} -F OUTPUT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish module"
        run: |
          pdk release publish --force
        env:
          PDK_FORGE_TOKEN: ${{ secrets.FORGE_API_KEY }}
